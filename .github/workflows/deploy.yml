name: IMN Education Deploy

on:
  workflow_run:
    workflows: ["IMN Education CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: imn-education-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production release
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Prepare and activate release
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          REPO=/home/localadmin/imn.kz/imn-education
          ROOT=/home/localadmin/deploy/imn-education
          RELEASES="$ROOT/releases"
          SHARED="$ROOT/shared"
          PM2=/usr/local/bin/pm2
          NODE=/home/localadmin/.nvm/versions/node/v24.16.0/bin

          cd "$REPO"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Deployment stopped: repository working tree is not clean." >&2
            git status --short
            exit 1
          fi

          git fetch origin main

          if [[ "$(git rev-parse origin/main)" != "$TARGET_SHA" ]]; then
            echo "Skipping stale CI run: target is no longer origin/main."
            exit 0
          fi

          git cat-file -e "$TARGET_SHA^{commit}"

          RELEASE="$RELEASES/$TARGET_SHA"
          PREVIOUS_RELEASE="$(readlink -f "$ROOT/current" || true)"

          if [[ -z "$PREVIOUS_RELEASE" || ! -d "$PREVIOUS_RELEASE" ]]; then
            echo "No bootstrap release found. Deployment is safely stopped." >&2
            exit 1
          fi

          test -f "$SHARED/backend.env"
          test -f "$SHARED/frontend.env.production"
          test -d "$SHARED/public"

          ACTIVATED=false

          if [[ "$(readlink -f "$ROOT/current" || true)" == "$RELEASE" ]]; then
            echo "Target release is already active."
            exit 0
          fi

          if [[ -e "$RELEASE" ]]; then
            echo "Release directory already exists; refusing to overwrite it." >&2
            exit 1
          fi

          cleanup() {
            local status=$?
            set +e

            if [[ "$status" -ne 0 ]]; then
              if [[ "$ACTIVATED" == true ]]; then
                echo "Deployment failed. Rolling back to $PREVIOUS_RELEASE" >&2
                rm -f "$ROOT/current.rollback"
                ln -s "$PREVIOUS_RELEASE" "$ROOT/current.rollback"
                mv -Tf "$ROOT/current.rollback" "$ROOT/current"
                for app in imn-education-backend imn-education-frontend imn-education-email-worker; do
                  "$PM2" delete "$app" 2>/dev/null || true
                done
                "$PM2" start "$ROOT/ecosystem.config.cjs" --update-env
              fi

              if [[ -d "$RELEASE" ]] &&
                 [[ "$(readlink -f "$ROOT/current" || true)" != "$RELEASE" ]]; then
                rm -rf -- "$RELEASE"
              fi
            fi
          }
          trap cleanup EXIT

          mkdir -p "$RELEASES"
          mkdir "$RELEASE"

          git archive "$TARGET_SHA" | tar -x -C "$RELEASE"

          # Attach persistent configuration and uploaded files.
          ln -s "$SHARED/backend.env" "$RELEASE/backend/.env"
          ln -s "$SHARED/frontend.env.production" "$RELEASE/frontend/.env.production"
          ln -s "$SHARED/public" "$RELEASE/backend/public"

          # Install dependencies and build without touching the active release.
          cd "$RELEASE/backend"
          "$NODE/npm" ci

          cd "$RELEASE/frontend"
          "$NODE/npm" ci
          "$NODE/npm" run build

          # Atomically activate the new release.
          rm -f "$ROOT/current.next"
          ln -s "$RELEASE" "$ROOT/current.next"
          mv -Tf "$ROOT/current.next" "$ROOT/current"
          ACTIVATED=true

          # Start or restart all three PM2 processes.
          for app in imn-education-backend imn-education-frontend imn-education-email-worker; do
                  "$PM2" delete "$app" 2>/dev/null || true
                done
                "$PM2" start "$ROOT/ecosystem.config.cjs" --update-env

          for app in imn-education-backend imn-education-frontend imn-education-email-worker; do
            "$PM2" describe "$app" | grep -q online
          done

          wait_for_http() {
            local url="$1"
            local attempts="$2"
            local allow_4xx="$3"
            local code=""

            for ((i = 1; i <= attempts; i++)); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || true)"

              if [[ "$code" =~ ^[23][0-9][0-9]$ ]] ||
                 { [[ "$allow_4xx" == true ]] && [[ "$code" =~ ^4[0-9][0-9]$ ]]; }; then
                echo "$url responded with HTTP $code"
                return 0
              fi

              sleep 2
            done

            echo "Health check failed: $url (last HTTP code: ${code:-none})" >&2
            return 1
          }

          wait_for_http http://127.0.0.1:3030/ 10 true
          wait_for_http http://127.0.0.1:3031/ 15 false

          # Keep the three most recently created releases.
          cd "$RELEASES"
          find . -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +4 \
            | cut -d' ' -f2- \
            | while IFS= read -r old_release; do
                old_release="${old_release#./}"
                [[ -n "$old_release" ]] || continue
                old_path="$RELEASES/$old_release"
                [[ "$old_path" == "$RELEASE" ]] && continue
                [[ "$old_path" == "$PREVIOUS_RELEASE" ]] && continue
                rm -rf -- "$old_path"
              done

          echo "Deployment successful: $TARGET_SHA"
